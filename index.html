<style>
:root{--navy:#0A1931;--navy2:#162B50;--gold:#8F6B29;--gold2:#B89A5A;--paper:#F5F7FB;--ink:#10213D;--muted:#6B7280;--line:#E8ECF3;--white:#fff;--green:#16834A;--shadow:0 5px 18px rgba(10,25,49,.07)}
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}

.tagline{font-size:8px;letter-spacing:.1px;margin-top:5px;color:#E9EDF5;white-space:nowrap}
.icon-button{border:0;background:transparent;color:white;font-size:22px;padding:7px;position:relative}
.dot{position:absolute;width:8px;height:8px;right:6px;top:5px;background:#E33B43;border-radius:50%;border:1px solid white}
.view{display:none;min-height:calc(100vh - 175px);padding-bottom:14px}.view.active{display:block}
.welcome{background:white;padding:16px 19px 13px}

.home-balance-amount small{font-size:12px;color:#8F6B29;letter-spacing:0}
